<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Remote Connection Manager</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="node_modules/xterm/css/xterm.css">
<script src="node_modules/xterm/lib/xterm.js"></script>
<script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-left drag-region">Remote Connection Manager</div>
  <div class="titlebar-controls">
    <!-- Windows-11-Symbole aus der Schrift "Segoe Fluent Icons" -->
    <button id="min-btn"   class="title-btn" title="Minimieren"><span class="caption-icon">&#xE921;</span></button>
    <button id="max-btn"   class="title-btn" title="Maximieren"><span class="caption-icon" id="max-icon">&#xE922;</span></button>
    <button id="close-btn" class="title-btn close" title="Schließen"><span class="caption-icon">&#xE8BB;</span></button>
  </div>
</div>

<div class="app-container">
  <aside class="sidebar">

    <!-- Topbar: Suche + Zahnrad (ersetzt "Connections"-Header) -->
    <div class="sidebar-topbar">
      <input type="text" id="search-input"
             class="sidebar-topbar-search"
             placeholder="🔍 Suchen..."
             autocomplete="off" spellcheck="false" />
      <button id="settings-btn" class="sidebar-settings-btn" title="Einstellungen">⚙</button>
    </div>
    <div id="sidebar-offline-notice" class="sidebar-offline-notice" style="display:none"></div>

    <div id="sidebar-tree" class="sidebar-tree"></div>
  </aside>

  <div id="sidebar-resizer"></div>

  <main class="content">
    <div id="tab-bar"></div>
    <div id="tab-content-area"></div>
  </main>
</div>

<!-- Auto-Update-Banner (unten rechts, standardmäßig versteckt) -->
<div id="update-banner" style="display:none">
  <div id="update-banner-inner">
    <div id="update-icon"></div>
    <div id="update-text"></div>
    <button id="update-action" style="display:none"></button>
    <button id="update-dismiss" title="Schließen">✕</button>
  </div>
  <div id="update-progress-track" style="display:none"><div id="update-progress-bar"></div></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
